<title>קבלות הדירה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, mobile first. Receipts look like thermal-paper slips; everything else is quiet. */
:root{
  --paper:#EEF1EC; --card:#FFFFFF; --slip:#FBFBF7; --ink:#1A2520; --muted:#5F6E66; --line:#D6DDD5;
  --accent:#1D6A54; --accent-soft:#DCEDE5; --accent-ink:#FFFFFF;
  --warn:#A9501A; --warn-soft:#FBEADC; --good:#1E7A3E; --bad:#B3261E;
  --m0:#D9480F; --m1:#1864AB; --m2:#862E9C; --m3:#2B8A3E; --m4:#C2255C; --m5:#8F6B00;
  --display:"Secular One","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121614; --card:#1A201D; --slip:#1F2622; --ink:#E4EAE6; --muted:#97A59D; --line:#2E3733;
  --accent:#5EC4A1; --accent-soft:#1C3A30; --accent-ink:#0B1712;
  --warn:#F0A46C; --warn-soft:#3A2618; --good:#6DD395; --bad:#F28880;
  --m0:#FF8A5B; --m1:#6FB2F2; --m2:#D08BE6; --m3:#73D18A; --m4:#F27BA6; --m5:#E3C04D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121614; --card:#1A201D; --slip:#1F2622; --ink:#E4EAE6; --muted:#97A59D; --line:#2E3733;
  --accent:#5EC4A1; --accent-soft:#1C3A30; --accent-ink:#0B1712;
  --warn:#F0A46C; --warn-soft:#3A2618; --good:#6DD395; --bad:#F28880;
  --m0:#FF8A5B; --m1:#6FB2F2; --m2:#D08BE6; --m3:#73D18A; --m4:#F27BA6; --m5:#E3C04D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:700;margin:0}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:7px 6px;border-radius:7px;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
main{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
button{font-family:var(--body)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px var(--body);padding:9px 14px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;padding:14px;font-size:16px;font-weight:700}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:14px}
.note.info{background:var(--accent-soft);color:var(--accent)}

/* who am I */
.me-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding-block:4px;padding-inline:4px 10px;font:500 13px var(--body);color:var(--ink);cursor:pointer}
.av{--c:var(--m0);width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:700 13px var(--body);background:var(--c);color:#fff;flex:none}
:root[data-theme="dark"] .av{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{color:#111}}
.chip,.av{--c:var(--m0)}
.c0{--c:var(--m0)}.c1{--c:var(--m1)}.c2{--c:var(--m2)}.c3{--c:var(--m3)}.c4{--c:var(--m4)}.c5{--c:var(--m5)}

/* summary */
.hero{display:flex;flex-direction:column;gap:4px}
.hero .amount{font-family:var(--mono);font-size:30px;line-height:1.1}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* receipt list */
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:start;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.rcard:hover{border-color:var(--muted)}
.rcard .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard .meta{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* the slip */
.slip{background:var(--slip);border:1px solid var(--line);border-radius:4px;padding:16px 14px 18px;position:relative;
  -webkit-mask:radial-gradient(circle 5px at 50% 100%,#0000 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 5px at 50% 100%,#0000 98%,#000) 0 0/14px 100% repeat-x;padding-bottom:22px}
.slip-head{text-align:center;display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.slip-head .store{font-family:var(--display);font-size:22px}
.items{list-style:none;margin:0;padding:0}
.item{padding:10px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:7px}
.item .l1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .name{min-width:0;overflow-wrap:anywhere}
.item .qty{color:var(--muted);font-size:13px}
.claims{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding-block:3px;padding-inline:4px 10px;font:500 13px var(--body);cursor:pointer}
.chip .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 12%,transparent)}
.chip[aria-pressed="true"] .dot{background:var(--c);color:var(--slip)}
.chip.all{padding-inline:10px;--c:var(--accent)}
.share{font-size:12px;color:var(--muted)}
.item.unclaimed .name::after{content:attr(data-un);margin-inline-start:8px;font-size:11px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 7px;vertical-align:middle}
.totals{display:flex;flex-direction:column;gap:4px;padding-top:10px}
.totals .spread{font-size:14px}
.totals .grand{font-weight:700;font-size:16px}

/* editor */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{font:15px var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.erow{display:grid;grid-template-columns:1fr 64px 96px 36px;gap:6px;align-items:center}
.erow input{padding:7px 8px}
.erow .x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;border-radius:6px;height:36px}
.erow .x:hover{color:var(--bad)}
.ehead{font-size:12px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px 14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;background:var(--card)}
.drop.over{border-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:64px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.status{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* balances */
.bal{display:flex;flex-direction:column;gap:10px}
.balrow{display:grid;grid-template-columns:minmax(80px,auto) 1fr 84px;gap:10px;align-items:center}
.bar{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar i.p{background:var(--good);inset-inline-start:50%}
.bar i.n{background:var(--bad);inset-inline-end:50%}
.bar::after{content:"";position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--muted)}
.xfer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.xfer:last-child{border-bottom:0}
.who{display:inline-flex;align-items:center;gap:6px}
.members-edit{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:auto 1fr 36px;gap:8px;align-items:center}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:8px;align-items:center}
@media (max-width:420px){.erow{grid-template-columns:1fr 52px 84px 30px}.grid2{grid-template-columns:1fr}}
/* language + camera + expenses */
.lang{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:700 12px var(--body);padding:5px 10px;cursor:pointer;letter-spacing:.04em}
.brand .row{gap:6px;flex-wrap:nowrap}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.actions .btn{padding:14px 10px;font-size:15px;font-weight:700}
.cam{display:flex;flex-direction:column;gap:12px}
.cam-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 14px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font:700 17px var(--body);cursor:pointer}
.cam-btn svg{width:26px;height:26px;flex:none}
.tips{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.parts{display:flex;gap:10px;flex-wrap:wrap}
.part{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.part img{width:72px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--slip)}
.part .rm{position:absolute;top:-8px;inset-inline-end:-8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:14px;line-height:1}
.drop.over{outline:2px dashed var(--accent);outline-offset:4px}
.exp-card{background:var(--slip);border:1px solid var(--line);border-radius:12px;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.exp-card .amt{font-family:var(--mono);font-size:28px}
.tag.exp{background:var(--line);color:var(--ink)}
</style>

<div class="wrap" id="wrap" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">
      <h1 id="h1">קבלות הדירה</h1>
      <div class="row"><span id="mePill"></span><button class="lang" id="langBtn" data-act="lang" aria-label="English">EN</button></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="list"></button>
      <button data-tab="balances"></button>
      <button data-tab="settings"></button>
    </nav>
  </header>
  <main id="app">
    <div class="panel"><div class="status"><span class="spin"></span>…</div></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>

function t(k,...a){ const v=(STR[S.lang][k] ?? STR.he[k] ?? k); return typeof v==="string" ? v.replace(/\{(\d)\}/g,(_,i)=>a[+i]??"") : v; }

const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((Number(n)||0)*100)/100;
const money=n=>{const v=r2(n);return `<span class="num">${v<0?"-":""}₪${Math.abs(v).toFixed(2)}</span>`;};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{if(!d)return"";const p=String(d).split("-");return p.length===3?`${p[2]}.${p[1]}.${p[0].slice(2)}`:esc(d);};
const isExp=r=>r&&r.kind==="expense";

function member(id){return S.members.find(m=>m.id===id);}
function mName(id){return member(id)?.name||t("someone");}
function av(id,size){const m=member(id);const ci=m?m.color%6:0;const s=size?`style="width:${size}px;height:${size}px;font-size:${Math.round(size/2)}px"`:"";return `<span class="av c${ci}" ${s} aria-hidden="true">${esc((m?.name||"?").trim().charAt(0))}</span>`;}
let toastT;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200);}

/* ---------- money math ---------- */
function claimantsOf(r,itemId){const c=(r.claims||{})[itemId]||{};return S.members.map(m=>m.id).filter(id=>c[id]===true);}
function receiptStats(r){
  let assigned=0,unassigned=0,unCount=0;const owe={};
  for(const it of r.items||[]){
    const who=claimantsOf(r,it.id);const p=Number(it.price)||0;
    if(!who.length){unassigned+=p;unCount++;continue;}
    assigned+=p;for(const id of who)owe[id]=(owe[id]||0)+p/who.length;
  }
  const total=(r.items||[]).reduce((a,it)=>a+(Number(it.price)||0),0);
  const touched=isExp(r)||!S.me?true:(r.items||[]).some(it=>((r.claims||{})[it.id]||{})[S.me]===true);
  return{assigned,unassigned,unCount,owe,total,touched};
}
function balances(){
  const net={};S.members.forEach(m=>net[m.id]=0);let unassigned=0;
  for(const r of S.receipts){
    const st=receiptStats(r);unassigned+=st.unassigned;
    if(r.payer in net)net[r.payer]+=st.assigned;
    for(const id in st.owe)if(id in net)net[id]-=st.owe[id];
  }
  for(const p of S.payments){
    if(p.from in net)net[p.from]+=Number(p.amount)||0;
    if(p.to in net)net[p.to]-=Number(p.amount)||0;
  }
  return{net,unassigned};
}
function settle(net){
  const deb=[],cred=[];
  for(const id in net){const v=r2(net[id]);if(v<-0.009)deb.push({id,v:-v});else if(v>0.009)cred.push({id,v});}
  deb.sort((a,b)=>b.v-a.v);cred.sort((a,b)=>b.v-a.v);
  const out=[];let i=0,j=0;
  while(i<deb.length&&j<cred.length){
    const a=Math.min(deb[i].v,cred[j].v);
    if(a>0.009)out.push({from:deb[i].id,to:cred[j].id,amount:r2(a)});
    deb[i].v-=a;cred[j].v-=a;
    if(deb[i].v<0.01)i++;if(cred[j].v<0.01)j++;
  }
  return out;
}

/* ---------- db writes ---------- */
async function write(fn,okMsg){
  if(!S.db){toast(t("noConn"));return false;}
  try{await fn();if(okMsg)toast(okMsg);return true;}
  catch(e){
    if(e&&e.code==="invalid_argument"){S.readOnly=true;render();toast(t("roToast"));}
    else if(e&&e.code==="quota_exceeded")toast(t("quota"));
    else toast(t("saveFail"));
    return false;
  }
}

/* ---------- rendering ---------- */
function chrome(){
  const w=document.getElementById("wrap");w.dir=S.lang==="he"?"rtl":"ltr";w.lang=S.lang;
  document.documentElement.lang=S.lang;
  document.getElementById("h1").textContent=t("title");
  const lb=document.getElementById("langBtn");lb.textContent=S.lang==="he"?"EN":"עב";lb.setAttribute("aria-label",S.lang==="he"?"English":"עברית");
  const tabs=document.getElementById("tabs");
  tabs.setAttribute("aria-label",S.lang==="he"?"ניווט":"Navigation");
  const names={list:t("tabList"),balances:t("tabBal"),settings:t("tabSet")};
  tabs.querySelectorAll("button").forEach(b=>{b.textContent=names[b.dataset.tab];b.setAttribute("aria-current",String(b.dataset.tab===S.tab));});
  tabs.hidden=!S.members.length;
  document.getElementById("mePill").innerHTML=S.me&&member(S.me)?`<button class="me-pill" data-act="whoami" title="${esc(t("switchUser"))}">${av(S.me)}${esc(mName(S.me))}</button>`:"";
}
function render(){
  chrome();
  if(S.failed&&!S.db){app.innerHTML=`<div class="panel empty"><h2>${t("noAccessH")}</h2><p class="muted">${t("noAccessP")}</p></div>`;return;}
  if(!S.got.house){app.innerHTML=`<div class="panel"><div class="status"><span class="spin"></span>${S.slow?t("slow"):t("loading")}</div></div>`;return;}
  if(!S.members.length&&S.view!=="members"){S.view="members";S.editingMembers=[0,1,2,3].map(c=>({id:"m"+uid(),name:"",color:c}));}
  if(S.view!=="members"&&S.members.length&&(!S.me||!member(S.me)))return renderWho();
  const ro=S.readOnly?`<div class="note">${t("roMsg")}</div>`:"";
  let html="";
  if(S.view==="members")html=renderMembers();
  else if(S.view==="draft")html=renderDraft();
  else if(S.view==="edraft")html=renderExpenseDraft();
  else if(S.view==="receipt")html=renderReceipt();
  else if(S.tab==="balances")html=renderBalances();
  else if(S.tab==="settings")html=renderSettings();
  else html=renderList();
  app.innerHTML=ro+html;
  if(S.view==="draft")bindDraft();
  if(S.view==="edraft")bindExpense();
}

function renderWho(){
  app.innerHTML=`<div class="panel"><h2>${t("whoH")}</h2><p class="muted small" style="margin:0">${t("whoP")}</p>
  <div class="row">${S.members.map(m=>`<button class="btn" data-act="setme" data-id="${esc(m.id)}">${av(m.id)}${esc(m.name)}</button>`).join("")}</div></div>`;
}

function renderList(){
  const{net,unassigned}=balances();const mine=r2(net[S.me]||0);
  const pending=S.receipts.filter(r=>!receiptStats(r).touched).length;
  const dis=S.readOnly?"disabled":"";
  let h=`<section class="panel hero">
    <span class="muted small">${t("yourBal",esc(mName(S.me)))}</span>
    <span class="amount ${mine>0.009?"pos":mine<-0.009?"neg":""}">${money(Math.abs(mine))}</span>
    <span class="small">${mine>0.009?t("owedYou"):mine<-0.009?t("youOwe"):t("even")}${unassigned>0.009?` · <span class="muted">${t("notMarkedYet",money(unassigned))}</span>`:""}</span>
    ${pending?`<span class="tag warn" style="align-self:flex-start">${pending===1?t("pendingOne"):t("pendingMany",pending)}</span>`:""}
  </section>
  <div class="actions"><button class="btn primary" data-act="newscan" ${dis}>${camIcon()}${t("scanBtn")}</button><button class="btn" data-act="newexp" ${dis}>+ ${t("expenseBtn")}</button></div>`;
  if(!S.receipts.length){
    h+=`<div class="panel empty"><h3>${t("emptyH")}</h3><p class="muted small" style="margin:0">${t("emptyP")}</p></div>`;
  }else{
    h+=`<div class="rlist">`+S.receipts.map(r=>{
      const st=receiptStats(r);const myShare=st.owe[S.me]||0;const ex=isExp(r);
      return `<button class="rcard" data-act="open" data-id="${esc(r.id)}">
        <span class="t">${esc(ex?(r.desc||t("expense")):(r.store||t("receipt")))}</span><span>${money(st.total)}</span>
        <span class="meta">${ex?`<span class="tag exp">${t("expense")}</span>`:""}<span>${fmtDate(r.date)}</span><span class="who">${av(r.payer,18)}${t("paidBy",esc(mName(r.payer)))}</span>
        ${ex?"":st.unCount?`<span class="tag warn">${t("nUnmarked",st.unCount)}</span>`:`<span class="tag">${t("allMarked")}</span>`}
        ${!st.touched?`<span class="tag warn">${t("notYou")}</span>`:myShare>0?`<span>${t("yourShare",money(myShare))}</span>`:""}</span>
      </button>`;}).join("")+`</div>`;
  }
  return h;
}
function camIcon(){return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;}
function chip(id,on,extra){const m=member(id);return `<button class="chip c${(m?.color||0)%6}" aria-pressed="${on}" ${extra}><span class="dot">${esc((m?.name||"?").charAt(0))}</span>${esc(m?.name||"")}</button>`;}
function payerSelect(r,dis){return `<select id="payerSel" style="width:auto" ${dis}>${S.members.map(m=>`<option value="${esc(m.id)}" ${m.id===r.payer?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`;}
function delBlock(r,dis){return S.confirmDel===r.id
  ?`<div class="panel"><span>${t("delQ")}</span><div class="row"><button class="btn danger" data-act="delyes">${t("delYes")}</button><button class="btn" data-act="delno">${t("cancel")}</button></div></div>`
  :`<button class="btn ghost danger" data-act="del" ${dis}>${isExp(r)?t("delExpense"):t("delReceipt")}</button>`;}

function renderReceipt(){
  const r=S.receipts.find(x=>x.id===S.openId);
  if(!r){S.view="list";return renderList();}
  const st=receiptStats(r);const dis=S.readOnly?"disabled":"";
  if(isExp(r)){
    const it=(r.items||[])[0]||{id:"x",price:0};const who=claimantsOf(r,it.id);
    return `<div class="spread"><button class="btn ghost" data-act="back">${t("back")}</button><button class="btn" data-act="edit" ${dis}>${t("edit")}</button></div>
    <article class="exp-card">
      <div class="spread"><h2>${esc(r.desc||t("expense"))}</h2><span class="amt">${money(st.total)}</span></div>
      <span class="muted small">${fmtDate(r.date)}</span>
      <label class="small row">${t("payer")} ${payerSelect(r,dis)}</label>
      <span class="small muted">${t("expHint")}</span>
      <div class="claims">${S.members.map(m=>chip(m.id,who.includes(m.id),`data-act="claim" data-item="${esc(it.id)}" data-m="${esc(m.id)}" ${dis}`)).join("")}
        <button class="chip all" aria-pressed="${who.length===S.members.length}" data-act="claimall" data-item="${esc(it.id)}" ${dis}>${t("all")}</button></div>
      <div class="totals">${S.members.map(m=>`<div class="spread"><span class="who">${av(m.id,20)}${esc(m.name)}</span>${money(st.owe[m.id]||0)}</div>`).join("")}
      ${st.unCount?`<div class="spread small" style="color:var(--warn)"><span>${t("unmarkedRow",1)}</span>${money(st.unassigned)}</div>`:""}</div>
    </article>${delBlock(r,dis)}`;
  }
  const mism=r.total!=null&&Math.abs(r2(r.total)-r2(st.total))>0.05;
  let h=`<div class="spread"><button class="btn ghost" data-act="back">${t("back")}</button><button class="btn" data-act="edit" ${dis}>${t("editItems")}</button></div>
  <div class="note info small">${t("claimHint")}</div>
  <article class="slip">
    <div class="slip-head"><span class="store">${esc(r.store||t("receipt"))}</span>
      <span class="muted small">${fmtDate(r.date)}</span>
      <label class="small row" style="justify-content:center">${t("payer")} ${payerSelect(r,dis)}</label>
    </div>
    <ul class="items">`+(r.items||[]).map(it=>{
      const who=claimantsOf(r,it.id);
      return `<li class="item ${who.length?"":"unclaimed"}">
        <div class="l1"><span class="name" data-un="${esc(t("unmarkedTag"))}">${esc(it.name)}${Number(it.qty)>1?` <span class="qty">×${esc(it.qty)}</span>`:""}</span>${money(it.price)}</div>
        <div class="claims">${S.members.map(m=>chip(m.id,who.includes(m.id),`data-act="claim" data-item="${esc(it.id)}" data-m="${esc(m.id)}" ${dis}`)).join("")}
          <button class="chip all" aria-pressed="${who.length===S.members.length}" data-act="claimall" data-item="${esc(it.id)}" ${dis}>${t("all")}</button></div>
        ${who.length>1?`<span class="share">${t("each",money((Number(it.price)||0)/who.length))}</span>`:""}
      </li>`;}).join("")+`</ul>
    <div class="totals">
      <div class="spread grand"><span>${t("itemsTotal")}</span>${money(st.total)}</div>
      ${mism?`<div class="spread small"><span class="muted">${t("printedTotal")}</span>${money(r.total)}</div>`:""}
      ${S.members.map(m=>`<div class="spread"><span class="who">${av(m.id,20)}${esc(m.name)}</span>${money(st.owe[m.id]||0)}</div>`).join("")}
      ${st.unCount?`<div class="spread small" style="color:var(--warn)"><span>${t("unmarkedRow",st.unCount)}</span>${money(st.unassigned)}</div>`:""}
    </div>
  </article>`;
  if(mism)h+=`<div class="note small">${t("mismatchLong",money(Math.abs(r.total-st.total)))}</div>`;
  if(st.unCount)h+=`<button class="btn" data-act="splitrest" ${dis}>${t("splitRest",st.unCount)}</button>`;
  return h+delBlock(r,dis);
}

function renderBalances(){
  const{net,unassigned}=balances();
  const max=Math.max(1,...Object.values(net).map(v=>Math.abs(v)));
  const xs=settle(net);const dis=S.readOnly?"disabled":"";
  const arrow=S.lang==="he"?"←":"→";
  let h=`<section class="panel"><h2>${t("balances")}</h2><div class="bal">`+S.members.map(m=>{
    const v=r2(net[m.id]||0);const w=Math.min(50,Math.abs(v)/max*50);
    return `<div class="balrow"><span class="who">${av(m.id)}${esc(m.name)}</span>
      <span class="bar" aria-hidden="true">${v>0?`<i class="p" style="width:${w}%"></i>`:v<0?`<i class="n" style="width:${w}%"></i>`:""}</span>
      <span class="${v>0.009?"pos":v<-0.009?"neg":"muted"}">${v>0.009?"+":""}${money(v)}</span></div>`;}).join("")+`</div>
    <p class="muted small" style="margin:0">${t("balHelp")}</p>

/* Prepare photos for reading: split very long receipts into overlapping pieces,
   then convert to grayscale with auto-levels so faded thermal print stands out. */
async function enhance(src,sx,sy,sw,sh){
  const scale=Math.min(1,2000/Math.max(sw,sh));
  const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
  const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d",{willReadFrequently:true});
  g.drawImage(src,sx,sy,sw,sh,0,0,w,h);
  try{
    const im=g.getImageData(0,0,w,h),px=im.data,hist=new Uint32Array(256),n=w*h;
    for(let i=0;i<px.length;i+=4){const y=(px[i]*77+px[i+1]*150+px[i+2]*29)>>8;px[i]=y;hist[y]++;}
    let lo=0,hi=255,acc=0;for(;lo<255;lo++){acc+=hist[lo];if(acc>n*0.01)break;}
    acc=0;for(;hi>0;hi--){acc+=hist[hi];if(acc>n*0.02)break;}
    if(hi-lo>20){const k=255/(hi-lo);for(let i=0;i<px.length;i+=4){const v=Math.max(0,Math.min(255,(px[i]-lo)*k));px[i]=px[i+1]=px[i+2]=v;}}
    else for(let i=0;i<px.length;i+=4){px[i+1]=px[i+2]=px[i];}
    g.putImageData(im,0,0);
  }catch(e){}
  return await new Promise(res=>c.toBlob(res,"image/jpeg",0.92));
}
async function prepImages(files,max){
  const out=[];
  for(const f of files){
    let bmp=null;try{bmp=await createImageBitmap(f,{imageOrientation:"from-image"});}catch(e){}
    if(!bmp){out.push(f);continue;}
    const w=bmp.width,h=bmp.height;
    if(h/w<=2.2){out.push((await enhance(bmp,0,0,w,h))||f);continue;}
    const segH=Math.round(w*1.5),ov=Math.round(segH*0.1);
    for(let y=0;y<h;){const sh=Math.min(segH,h-y);const b=await enhance(bmp,0,y,w,sh);if(b)out.push(b);if(y+sh>=h)break;y+=sh-ov;}
  }
  return out.length<=max?out:files.slice(0,max);
}

const PROMPT=`The images are photos of ONE supermarket receipt (most likely from Israel, mostly Hebrew). If there are several images they are consecutive parts of the same receipt from top to bottom and may overlap; do not list a line twice because it appears in two parts.

Extract every purchased product line.
- name: the product name as printed, in its original language, without barcodes or item codes. Fix obvious OCR noise only.
- qty: the quantity or weight in units/kg as printed (1 if not shown).
- price: the FINAL line amount in shekels for that product, after any discount lines that belong to it (lines such as "הנחה", "מבצע", "הנחת מועדון" with a minus sign, usually right under the product). A deposit line (פיקדון) belongs to the product above it; add it to that product's price.
- A discount that cannot be tied to one product (for example a basket discount) becomes its own item with a negative price.
- Do not include subtotal, total, VAT, payment method, change, club points or bag-count lines unless a bag was charged.

Also read the store name, the purchase date, and the final total paid.

Reply with only JSON in exactly this shape:
{"store": "שופרסל דיל", "date": "2026-11-05", "total": 123.45, "items": [{"name": "חלב 3% 1 ליטר", "qty": 2, "price": 13.80}]}
Use null for store, date or total if unreadable. Prices are numbers, not strings.`;

async function readReceipt(){
  const sc=S.scan;if(!S.sample||!sc.files.length||sc.busy)return;
  sc.busy=true;sc.msg=t("prep");render();
  const ctl=new AbortController();sc.ctl=ctl;
  try{
    const imgs=await prepImages(sc.files,S.imgLimits?.maxCount||5);
    if(ctl.signal.aborted)throw{code:"cancelled"};
    sc.msg=t("reading");render();
    const res=await S.sample.json(PROMPT,{images:imgs,signal:ctl.signal});
    const items=(Array.isArray(res?.items)?res.items:[]).map(it=>({id:"i"+uid(),name:String(it?.name??"").trim(),qty:Number(it?.qty)||1,price:r2(it?.price)})).filter(it=>it.name||it.price);
    if(!items.length)sc.msg=t("noItems");
    else{
      const d=S.draft;d.items=items;
      if(res.store)d.store=String(res.store);
      if(res.date&&/^\d{4}-\d{2}-\d{2}$/.test(res.date))d.date=res.date;
      if(res.total!=null&&!isNaN(Number(res.total)))d.total=r2(res.total);
      sc.msg=t("found",items.length);
    }
  }catch(e){
    const c=e?.code;
    sc.msg=c==="cancelled"?"":c==="not_granted"?t("errNotGranted"):c==="rate_limited"?t("errRate"):c==="image_rejected"?t("errImage")
      :c==="invalid_json"?t("errJson"):(c==="sampling_disabled"||c==="images_unavailable")?t("errUnavailable"):t("errOther");
  }finally{if(S.scan===sc){sc.busy=false;sc.ctl=null;if(S.view==="draft")render();}}
}

async function saveDraft(){
  const d=S.draft;
  const items=d.items.map(it=>({id:it.id,name:String(it.name||"").trim()||t("item"),qty:Number(it.qty)||1,price:r2(it.price)}));
  const body={store:String(d.store||"").trim(),date:d.date||today(),payer:d.payer||S.me,items,total:d.total===""||d.total==null||isNaN(Number(d.total))?null:r2(d.total)};
  let ok;
  if(d.editId){
    const old=S.receipts.find(r=>r.id===d.editId)||{};const{id:_omit,...rest}=old;
    const keep={};for(const it of items)if(old.claims&&old.claims[it.id])keep[it.id]=old.claims[it.id];
    ok=await write(()=>S.db.doc("receipts/"+d.editId).set({...rest,...body,claims:keep,createdAt:old.createdAt||Date.now()}),t("saved"));
    if(ok){S.view="receipt";S.openId=d.editId;}
  }else{
    const ref=S.db.collection("receipts").doc();
    ok=await write(()=>ref.set({...body,kind:"receipt",claims:{},createdAt:Date.now(),by:S.me}),t("receiptSaved"));
    if(ok){S.view="receipt";S.openId=ref.id;resetScan();}
  }
  if(ok){S.draft=null;render();window.scrollTo(0,0);}
}

    case "mdel":syncMemberInputs();S.editingMembers.splice(+b.dataset.i,1);render();break;
    case "mcancel":S.editingMembers=null;S.view="list";render();break;
    case "msave":{syncMemberInputs();const list=S.editingMembers.map(m=>({id:m.id,name:m.name.trim(),color:m.color})).filter(m=>m.name);
      if(list.length<2){toast(t("needTwo"));break;}
      if(await write(()=>S.db.doc("house/main").set({members:list}),t("saved"))){S.editingMembers=null;S.view="list";render();}break;}
    case "read":readReceipt();break;
    case "stop":S.scan.ctl?.abort();break;
    case "addrow":S.draft.items.push({id:"i"+uid(),name:"",qty:1,price:""});render();{const last=S.draft.items[S.draft.items.length-1];document.getElementById("in-"+last.id)?.focus();}break;
    case "rmrow":S.draft.items.splice(+b.dataset.i,1);render();break;
    case "cancelDraft":{const ed=S.draft?.editId;S.draft=null;resetScan();S.view=ed?"receipt":"list";render();break;}
    case "saveDraft":b.disabled=true;await saveDraft();b.disabled=false;break;
    case "ewho":{const id=b.dataset.m;S.edraft.who[id]=!S.edraft.who[id];render();break;}
    case "ewhoall":{const all=S.members.every(m=>S.edraft.who[m.id]);S.members.forEach(m=>S.edraft.who[m.id]=!all);render();break;}
    case "cancelExp":{const ed=S.edraft?.editId;S.edraft=null;S.view=ed?"receipt":"list";render();break;}
    case "saveExp":b.disabled=true;await saveExpense();b.disabled=false;break;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="payerSel"){const r=S.receipts.find(x=>x.id===S.openId);if(r)write(()=>S.db.doc("receipts/"+r.id).update({payer:e.target.value}),t("payerUpdated"));}
});
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.mi!=null&&S.editingMembers){S.editingMembers[+e.target.dataset.mi].name=e.target.value;}});
function syncMemberInputs(){document.querySelectorAll("[data-mi]").forEach(el=>{if(S.editingMembers&&S.editingMembers[+el.dataset.mi])S.editingMembers[+el.dataset.mi].name=el.value;});}

/* data updates must not wipe a form someone is typing in */
function onData(){if(S.view==="draft"||S.view==="edraft"||(S.view==="members"&&S.members.length)){chrome();return;}render();}

/* ---------- boot ---------- */
render();
(async()=>{
  const cl=window.claude;
  if(!cl||typeof cl.use!=="function"){S.failed=true;render();return;}
  const db=await cl.use("db");
  if(!db){S.failed=true;render();return;}
  S.db=db;
  const slowT=setTimeout(()=>{S.slow=true;if(!S.got.house)render();},10000);
  db.doc("house/main").onSnapshot(snap=>{
    S.members=(snap.data()?.members)||[];S.got.house=true;if(!snap.metadata.fromCache)clearTimeout(slowT);
    const wasOnboard=S.view==="members"&&S.editingMembers&&S.editingMembers.every(m=>!m.name);
    if(wasOnboard&&S.members.length){S.view="list";S.editingMembers=null;}
    if(S.view==="members"&&!S.members.length)render();else onData();
  },()=>{S.got.house=true;clearTimeout(slowT);render();});
  db.collection("receipts").orderBy("createdAt","desc").onSnapshot(snap=>{S.receipts=snap.docs.map(d=>({id:d.id,...d.data()}));onData();},()=>{});
  db.collection("payments").onSnapshot(snap=>{S.payments=snap.docs.map(d=>({id:d.id,...d.data()}));onData();},()=>{});
  try{const u=await cl.use("user");const w=u?await u.can("data.write"):null;if(w===false){S.readOnly=true;render();}}catch(e){}
  try{const sm=await cl.use("sample");if(sm){S.sample=sm;const lim=await sm.limits().catch(()=>null);S.imgLimits=lim?.images||null;if(S.view==="draft")render();}}catch(e){}
})();
})();
</script>
